# =============================================================================
#  NDot Music -- Rockbox theme configuration
#  Hidizs AP80 Pro Max . 360x640 portrait . red accent
# =============================================================================
font: /.rockbox/fonts/NDot-16.fnt
wps: /.rockbox/wps/NDotMusic.wps
sbs: /.rockbox/wps/NDotMusic.sbs
statusbar: top
selector type: bar (color)
foreground color: FFFFFF
background color: 000000
line selector start color: 000000
line selector end color: 000000
line selector text color: 000000


# Backlight at 5 % (the AP80 Pro Max range is 1..100): the dot-matrix look is easy on a dim screen.
# Applying the theme sets it; change it in Settings > Display > Brightness whenever you like.
brightness: 5

# touch: the AP80 Pro Max defaults to "grid" mode (the screen is a 3x3 pad of buttons, rows cannot be
# tapped).  "point" makes every row, button and touch area in the theme work where you tap.
touchscreen mode: point
